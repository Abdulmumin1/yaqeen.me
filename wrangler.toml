# Cloudflare Workers Static Assets configuration
# See: https://kit.svelte.dev/docs/adapter-cloudflare#cloudflare-workers

name = "yaqeen-me"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-04-12"
compatibility_flags = ["nodejs_compat_v2"]

# Static assets are served through the ASSETS binding by the SvelteKit worker.
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "yaqeen-me-photos"

[[durable_objects.bindings]]
name = "GUESTBOOK"
class_name = "Guestbook"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Guestbook"]
